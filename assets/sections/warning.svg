<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="76" viewBox="0 0 1160 76" fill="none" role="img" aria-label="警告">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2e63"/>
      <stop offset="1" stop-color="#ff2e63" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e63" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff2e63" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0.75" y="0.75" width="1158.5" height="74.5" rx="10" fill="#0b0b16" stroke="#ff2e63" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="0" y="0" width="7" height="76" rx="3.5" fill="url(#bar)"/>
  <text x="34" y="50" font-family="'Consolas','SFMono-Regular',monospace" font-size="30" font-weight="700" fill="#ff2e63" fill-opacity="0.85">&gt;</text>
  <text x="62" y="36" font-family="'WenQuanYi Zen Hei','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="25" font-weight="700" letter-spacing="2" fill="#f3efff" filter="url(#g)">警告</text>
  <text x="64" y="58" font-family="'Consolas','SFMono-Regular',monospace" font-size="11.5" letter-spacing="4" fill="#ff2e63" fill-opacity="0.9">WARNING</text>
  <line x1="700" y1="38" x2="1128" y2="38" stroke="url(#fade)" stroke-width="1.3"/>
  <circle cx="1100" cy="38" r="4" fill="#ff2e63"/>
  <circle cx="1078" cy="38" r="4" fill="#ff2e63" fill-opacity="0.55"/>
  <circle cx="1056" cy="38" r="4" fill="#ff2e63" fill-opacity="0.25"/>
</svg>
