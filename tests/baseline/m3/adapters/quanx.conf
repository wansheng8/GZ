# Adblock Rule Collection — Quantumult X 适配
# 用法：把下列 filter_remote 行加入配置文件的 [filter_remote] 段。
#   force-remote-filter=1 表示由 Quantumult X 解析远端规则。
#
# 规范基址：https://raw.githubusercontent.com/wansheng8/GZ/main/dist/rulesets/adblock_quanx.list
# 镜像基址：https://cdn.jsdelivr.net/gh/wansheng8/GZ@main/dist/rulesets/adblock_quanx.list
#
filter_remote = https://cdn.jsdelivr.net/gh/wansheng8/GZ@main/dist/rulesets/adblock_quanx.list, tag=Adblock, force-remote-filter=1
