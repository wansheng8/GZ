# Adblock Rule Collection — Surge 适配
# 用法：把下面一行加入配置文件的 [Rule] 段。
# DOMAIN-SET 默认 86400 秒重新下载一次，这里显式写出 update-interval。
#
# 规范基址：https://raw.githubusercontent.com/wansheng8/GZ/main/dist/rulesets/adblock_surge_domain_set.txt
# 镜像基址：https://cdn.jsdelivr.net/gh/wansheng8/GZ@main/dist/rulesets/adblock_surge_domain_set.txt
#
DOMAIN-SET,https://cdn.jsdelivr.net/gh/wansheng8/GZ@main/dist/rulesets/adblock_surge_domain_set.txt,REJECT,update-interval=86400
