# Adblock Rule Collection — Quantumult X 适配
# 用法：把下列 filter_remote 行加入配置文件的 [filter_remote] 段。
#   force-policy=reject 让 Quantumult X 忽略远端规则内的策略，统一按 reject 处理。
#
# 规范源（raw）完整文件：https://raw.githubusercontent.com/wansheng8/GZ/main/dist/rulesets/adblock_quanx.list
# 镜像基址：https://cdn.jsdelivr.net/gh/wansheng8/GZ@main/dist/
#
# 完整规则集超出 jsDelivr 单文件上限，镜像须使用下列分片，请全部加入；
# 可直连 GitHub raw 时，也可只引用上面的完整文件。
filter_remote = https://cdn.jsdelivr.net/gh/wansheng8/GZ@main/dist/rulesets/adblock_quanx_part01.list, tag=Adblock-1, force-policy=reject, enabled=true
filter_remote = https://cdn.jsdelivr.net/gh/wansheng8/GZ@main/dist/rulesets/adblock_quanx_part02.list, tag=Adblock-2, force-policy=reject, enabled=true
