name: Build Filters

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "assets/**"
      - "README.md"
      - "LICENSE"

permissions:
  contents: write

# 串行化构建：连续 push 会触发多个 run。并发执行时，后完成的 run 会因为
# 远端已被先完成的 run 推送而 push 失败（non-fast-forward），出现红色报错。
concurrency:
  group: build-filters
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-cache-${{ github.run_id }}
          restore-keys: |
            sources-cache-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Clean stale dist
        run: rm -rf dist && mkdir dist
      - name: Build filters
        run: python -m adblock_collection build --out dist --split-by-category --redundant
      - name: Check build health
        id: health
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("dist/manifest.json"))
          entries = {x["file"]: x["rules"] for x in m["generated_files"]}
          total = entries.get("adblock_collection_full.txt", 0)
          status = json.load(open("dist/sources_status.json"))
          failed = status.get("failed_sources", [])
          print(f"完整版规则数: {total}")
          print(f"失败源数: {len(failed)} -> {failed}")
          # 规则数骤降或大量源失败则标记异常（不阻断推送，但输出供审查）
          if total < 300000:
              print("WARNING: 完整版规则数异常偏低，可能上游大面积失败")
          if len(failed) >= 5:
              print("WARNING: 超过 5 个上游源下载失败")
          PY
      - name: Check for changes
        id: changes
        run: |
          git add -A dist/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto update filter lists [skip ci]"
          # 远端可能被并发 run 或人工 push 推进，先 rebase 再推。
          # dist 是生成物，冲突时以本次刚构建的产物为准（rebase 中 --theirs 即本地产物）。
          pushed=false
          for attempt in 1 2 3; do
            if git fetch origin main \
              && git rebase -X theirs origin/main \
              && git push origin main; then
              pushed=true
              break
            fi
            echo "push attempt ${attempt} failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          if [ "$pushed" != "true" ]; then
            echo "ERROR: failed to push after 3 attempts"
            exit 1
          fi
