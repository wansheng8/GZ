name: Build Filters

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "assets/**"
      - "README.md"
      - "LICENSE"

permissions:
  contents: write

# 串行化构建：连续 push 会触发多个 run。并发执行时，后完成的 run 会因为
# 远端已被先完成的 run 推送而 push 失败（non-fast-forward），出现红色报错。
concurrency:
  group: build-filters
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 单次构建约 7-9 分钟；给足余量同时避免网络/构建挂起长时间占用 runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache source downloads and parse stage
        uses: actions/cache@v4
        with:
          # sources: 原始文本；parsed: 解析阶段缓存（key = 源内容 sha256 + 算法版本），
          # 上游未变化时直接复用已解析规则，跳过全量重解析。
          path: |
            .cache/sources
            .cache/parsed
          key: sources-cache-${{ github.run_id }}
          restore-keys: |
            sources-cache-
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests
        run: python -m pytest -q
      - name: Lint local lists
        # U3：本地增强规则与自定义黑/白名单的语法/冲突门禁（默认校验这三份文件）。
        # 只读、秒级；存在 error 时退出码 2，阻断后续构建与 dist 推送。
        run: python -m adblock_collection lint
      - name: Clean stale dist
        run: |
          # 保留上一批门禁基线，供本次质量门禁与构建差异报告使用
          if [ -f dist/previous_metrics.json ]; then
            cp dist/previous_metrics.json /tmp/previous_metrics.json
          fi
          rm -rf dist && mkdir dist
          if [ -f /tmp/previous_metrics.json ]; then
            cp /tmp/previous_metrics.json dist/previous_metrics.json
          fi
      - name: Build filters
        run: python -m adblock_collection build --out dist --split-by-category
      - name: Upload rules.jsonl artifact
        uses: actions/upload-artifact@v4
        with:
          name: rules-jsonl
          path: .cache/build/rules.jsonl
          if-no-files-found: warn
          retention-days: 7
      - name: Check build health
        id: health
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("dist/manifest.json"))
          entries = {x["file"]: x.get("rules", 0) for x in m["generated_files"]}
          total = entries.get("adblock_collection_full.txt", 0)
          status = json.load(open("dist/sources_status.json"))
          failed = status.get("failed_sources", [])
          print(f"完整版规则数: {total}")
          print(f"失败源数: {len(failed)} -> {failed}")
          net = entries.get("adblock_collection_full_browser_network.txt", 0)
          cos = entries.get("adblock_collection_full_cosmetic.txt", 0)
          abp = entries.get("adblock_collection_full_dns_abp.txt", 0)
          print(f"三层产物: 网络拦截 {net} / 元素隐藏 {cos} / DNS 等价 {abp}")
          allow = entries.get("dns_allow.txt", 0)
          ubo = entries.get("adblock_collection_ubo_enhance.txt", 0)
          print(f"增量产物: DNS 白名单 {allow} / uBO 增强 {ubo}")

          # 硬失败：产物结构性缺失、绝对量异常偏低、大量上游失败，均阻断推送以待人工介入
          errors = []
          if not net or not cos or not abp:
              errors.append("三层产物缺失（browser_network / cosmetic / dns_abp）")
          elif total and net + cos != total:
              errors.append(f"三层并集 {net + cos} != 完整版 {total}")
          if not ubo:
              errors.append("uBO 增强清单为空（adblock_collection_ubo_enhance.txt）")
          if total < 300000:
              errors.append(f"完整版规则数异常偏低：{total}（可能上游大面积失败）")
          if len(failed) >= 5:
              errors.append(f"{len(failed)} 个上游源下载失败")
          # 白名单为空属正常（自定义白名单可能不含整域全局例外），仅提示
          if not allow:
              print("WARNING: DNS 白名单为空（dns_allow.txt），若自定义白名单无整域全局例外则属正常")

          # B1：manifest 自洽——条目必须能定位到实际文件，且 bytes 与磁盘大小一致
          import os
          bad_bytes = [
              e["file"]
              for e in m["generated_files"]
              if not os.path.exists(os.path.join("dist", e["file"]))
              or e.get("bytes") != os.path.getsize(os.path.join("dist", e["file"]))
          ]
          if bad_bytes:
              errors.append(f"manifest 条目缺失或 bytes 不符: {bad_bytes[:5]}")
          if not m.get("versions"):
              errors.append("manifest 缺少 versions 溯源字段")

          # B2：Surge DOMAIN-SET 必须存在、非空、不超过单集上限，并与 DNS 域名数一致
          domain_set = entries.get("rulesets/adblock_surge_domain_set.txt", 0)
          dns_domains = entries.get("adblock_collection_full_dns.txt", 0)
          print(f"Surge DOMAIN-SET 域名数: {domain_set}")
          if not domain_set:
              errors.append("Surge DOMAIN-SET 产物缺失或为空")
          elif domain_set > 1000000:
              errors.append(f"Surge DOMAIN-SET 超过单集上限: {domain_set}")
          elif dns_domains and domain_set != dns_domains:
              errors.append(f"DOMAIN-SET {domain_set} 与 DNS 域名数 {dns_domains} 不一致")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              sys.exit(1)
          PY
      - name: Audit unknown filter modifiers
        run: |
          python - <<'PY'
          import json

          # U2：未知修饰符明细（dns_safety.json 的 unknown_modifiers）是「漏拦/误拦」的
          # 先行指标——上游新增修饰符若未及时纳入白名单，就会被 fail-closed 拒绝而降覆盖。
          # 这里只告警不阻断，把可疑项以 GitHub annotation 形式浮到 run 摘要供人工评估。
          threshold = 50
          data = json.load(open("dist/adblock_collection_full.dns_safety.json"))
          unknown = data.get("unknown_modifiers", {})
          total = sum(unknown.values())
          print(f"未知修饰符被拒绝的网络规则总数: {total}（共 {len(unknown)} 种）")
          flagged = sorted(
              (kv for kv in unknown.items() if kv[1] >= threshold),
              key=lambda kv: -kv[1],
          )
          for name, count in flagged:
              print(
                  "::warning file=dist/adblock_collection_full.dns_safety.json::"
                  f"未识别修饰符 ${name} 被 fail-closed 拒绝 {count} 次，"
                  "请评估是否需纳入类型/作用域/非阻断清单"
              )
          if not flagged:
              print(f"没有出现次数 >= {threshold} 的未知修饰符")
          PY
      - name: Verify default enhancement reports
        run: |
          python - <<'PY'
          import json
          report = json.load(open("dist/build_report.json"))
          enhancements = report.get("enhancements", {})
          for key in ("alias_normalize", "resolve_conflicts", "per_rule_classify", "domain_fold"):
              if key not in enhancements:
                  raise SystemExit(f"missing enhancement report: {key}")
              print(f"{key}: {enhancements[key]}")
          PY
      - name: Build filters (all enhancements off, legacy baseline)
        run: |
          python -m adblock_collection build \
            --out /tmp/dist-legacy \
            --split-by-category --redundant \
            --no-alias-normalize --no-resolve-conflicts \
            --no-per-rule-classify --no-domain-fold
      - name: Verify opt-out path
        run: |
          python - <<'PY'
          import json, pathlib
          report = json.load(open("/tmp/dist-legacy/build_report.json"))
          if report.get("enhancements"):
              raise SystemExit(f"enhancements not disabled: {report['enhancements']}")
          for name in ("manifest.json", "adblock_collection_full_browser_network.txt"):
              if not (pathlib.Path("/tmp/dist-legacy") / name).exists():
                  raise SystemExit(f"missing artifact: {name}")
          print("opt-out build ok")
          PY
      - name: Sync stats badges
        run: python -m adblock_collection.stats_badge
      - name: Update MEMORY metrics snapshot
        run: python -m adblock_collection.memory_metrics
      - name: Check for changes
        id: changes
        run: |
          git add -A dist/ README.md assets/stats.svg .monkeycode/MEMORY.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto update filter lists [skip ci]"
          # 远端可能被并发 run 或人工 push 推进，先 rebase 再推。
          # dist 是生成物，冲突时以本次刚构建的产物为准（rebase 中 --theirs 即本地产物）。
          pushed=false
          for attempt in 1 2 3; do
            if git fetch origin main \
              && git rebase -X theirs origin/main \
              && git push origin main; then
              pushed=true
              break
            fi
            echo "push attempt ${attempt} failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          if [ "$pushed" != "true" ]; then
            echo "ERROR: failed to push after 3 attempts"
            exit 1
          fi
