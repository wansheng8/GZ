# 误杀回归清单
#
# allow : 这些域名（及其任意祖先域）绝不应被整域阻断。一旦某次上游更新把其中任何域名
#         或其祖先域加入了整域拦截，构建将报违规，阻止发布，避免大站被误封。
# block : 这些域名（及其任意祖先域）应当被整域阻断。若全部缺失，提示可能漏拦。
#
# 注意：仅校验「整域阻断」类规则（纯域名 / 带修饰符的单域名规则），不校验 CSS 元素隐藏。

