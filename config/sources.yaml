name: Adblock Rule Collection
description: "上游广告过滤规则列表配置。compatible 字段表示该列表兼容的语法，category 字段用于统计与按类型拆分。"
sources:
  # ----------------- AdGuard 官方列表（低风险） -----------------
  - name: AdGuard Base
    url: https://filters.adtidy.org/extension/ublock/filters/2.txt
    mirror: https://filters.adtidy.org/android/filters/2.txt
    category: network
    compatible: [adguard, abp, ubo]
    lite: true
  - name: AdGuard Tracking Protection
    url: https://filters.adtidy.org/extension/ublock/filters/3.txt
    mirror: https://filters.adtidy.org/android/filters/3.txt
